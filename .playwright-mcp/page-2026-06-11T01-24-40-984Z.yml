          - paragraph [ref=e722]: 我是南加州大學（USC）計算機科學專業的大三學生。在臺北長大，過去兩個夏天在臺灣和中國大陸做軟件，如今大部分時間在洛杉磯和一臺筆記本電腦之間度過。
          - paragraph [ref=e723]: 我的本能是構建整個系統，而不只是界面。在臺北的 Kenmou Enterprise，我把一套 React + Node 訂單處理儀表盤接入了生產車間——那種好用到沒人再注意它的工具。在蘇州的 Far Eastern Apparel，我為一支 20 人團隊交付了四個內部工具——RPA 機器人、React 互動門戶、Android 應用和 Python 數據管道。這些環境塑造了我對軟件的理解：它必須可靠、易懂，並且對非工程師同樣有用。大學之前，我創辦了 PulsePrep Academy，用兩年時間教了 50+ 名學生、橫跨三套 IGCSE 課程體系。
          - paragraph [ref=e724]: 2026 年夏天將以工程實習生身份加入 Flex 蘇州園區。正在尋找 2027 年夏季的軟件工程或應用 AI 實習——那種把東西做出來、量化它、再迭代的團隊。尤其喜歡智能體系統、前後端邊界刻意模糊的全棧工作，以及能默默讓另外十個工程師更快的基礎設施。
