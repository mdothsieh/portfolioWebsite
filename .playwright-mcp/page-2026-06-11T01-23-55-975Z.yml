      - generic [ref=e720]:
        - generic [ref=e721]:
          - paragraph [ref=e722]: 我是南加州大学（USC）计算机科学专业的大三学生。在台北长大，过去两个夏天在台湾和中国大陆做软件，如今大部分时间在洛杉矶和一台笔记本电脑之间度过。
          - paragraph [ref=e723]: 我的本能是构建整个系统，而不只是界面。在台北的 Kenmou Enterprise，我把一套 React + Node 订单处理仪表盘接入了生产车间——那种好用到没人再注意它的工具。在苏州的 Far Eastern Apparel，我为一支 20 人团队交付了四个内部工具——RPA 机器人、React 互动门户、Android 应用和 Python 数据管道。这些环境塑造了我对软件的理解：它必须可靠、易懂，并且对非工程师同样有用。大学之前，我创办了 PulsePrep Academy，用两年时间教了 50+ 名学生、横跨三套 IGCSE 课程体系。
          - paragraph [ref=e724]: 2026 年夏天将以工程实习生身份加入 Flex 苏州园区。正在寻找 2027 年夏季的软件工程或应用 AI 实习——那种把东西做出来、量化它、再迭代的团队。尤其喜欢智能体系统、前后端边界刻意模糊的全栈工作，以及能默默让另外十个工程师更快的基础设施。
