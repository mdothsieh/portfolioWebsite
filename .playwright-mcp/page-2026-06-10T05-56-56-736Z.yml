      - generic [ref=e397]:
        - generic [ref=e398]:
          - paragraph [ref=e399]: I'm a rising junior at USC studying computer science. I grew up in Taipei, spent the last two summers shipping software in Taiwan and mainland China, and now spend most of my days somewhere between LA and a laptop.
          - paragraph [ref=e400]: My instinct is to build the system, not just the screen. Last summer at Kenmou Enterprise in Taipei I wired a React + Node order-processing dashboard into the production floor and watched cross-team coordination overhead drop 35%. The summer before, at Far Eastern Apparel in Suzhou, I shipped four production tools — RPA bots, a React engagement portal, an Android app, and a Python data pipeline — across a 20-person team. Before college I founded PulsePrep Academy, teaching 50+ middle and high schoolers across three IGCSE curricula for two years.
          - paragraph [ref=e401]: Joining Flex Ltd's Suzhou facility for Summer 2026 as an engineering intern. Looking for Summer 2027 roles in software engineering or applied AI — teams that ship things, measure them, and iterate. Especially drawn to agentic systems, full-stack work where the line between front and back is intentionally blurred, and infrastructure that quietly makes ten other engineers faster.
